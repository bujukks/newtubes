name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :smarttubetv:assembleStmobileDebug --no-daemon --max-workers=2

      - uses: actions/upload-artifact@v4
        with:
          name: newtube-debug-apk
          path: smarttubetv/build/outputs/renamed_apks/stmobileDebug/*.apk
